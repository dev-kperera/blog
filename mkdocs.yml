site_name: Kushan Perera
site_url: https://kushanperera.com

theme:
  name: material
  features:
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  - blog:
      enabled: true
      blog_dir: blog
      post_date_format: long
      post_url_date_format: yyyy
      post_url_format: "{slug}"
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  # - tags:
  #     enabled: true
  # - social:
  #     enabled: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  
nav:
  - Blog:
    - blog/index.md

extra_css:
  - stylesheets/code.css