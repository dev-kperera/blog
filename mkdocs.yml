site_name: Kushan Perera
site_url: https://kushanperera.com

theme:
  name: material
  # custom_dir: overrides
  features:
    - navigation.indexes
    - content.code.copy
    - navigation.footer

# Footer configurations
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://fosstodon.org/@squidfunk
    - icon: fontawesome/solid/paper-plane
      link: mailto:footer@kushanperera.com
    - icon: fontawesome/brands/github
      link: https://github.com/dev-kperera
  generator: false

copyright: Copyright &copy; Kushan Perera  

plugins:
  - obsidian-interactive-graph
  - search
  - blog:
      enabled: true
      blog_dir: blog
      post_date_format: long
      post_url_date_format: yyyy
      post_url_format: "{slug}"
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  
  # - tags:
  #     enabled: true
  # - social:
  #     enabled: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  # Icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  
nav:
  - Blog:
    - blog/index.md
extra_javascript:
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js
  - javascripts/interactive_graph.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/interactive_graph.css